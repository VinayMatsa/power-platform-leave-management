App:
  Properties:
    OnStart: |-
      =// Runs once when the app opens.
      //
      // Why Today() is cached into a variable:
      // Learn states DateTime is delegable EXCEPT for the functions Now() and
      // Today(). Calling Today() directly inside a Filter() breaks delegation for
      // the whole formula. Calling it once here and storing the result gives us a
      // plain date value that Dataverse can handle server-side.
      Set(varToday, Today());
      Set(varThisYear, Year(Today()));

      // Cache the signed-in user so we don't call User() repeatedly.
      Set(varUserEmail, User().Email);

      // Confirm startup in Monitor. The user sees nothing from this.
      Trace(
          "App started",
          TraceSeverity.Information,
          { User: varUserEmail, StartedAt: Text(Now(), "yyyy-mm-dd hh:mm:ss") }
      );
    Theme: =PowerAppsTheme
