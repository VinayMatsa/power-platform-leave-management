Screens:
  LeaveListScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - galLeaveRequests:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderThickness: =3
            Fill: =RGBA(204, 231, 246, 1)
            Height: =317
            Items: |-
              =Filter('Leave Requests', 'Start Date' > Today())
              // Items = "WHAT data shows in the list?"
              //
              // This uses a DATAVERSE VIEW as the filter — the view you built in Lab 2.
              // The view's own filter (Approval Status is not 'Rejected') is applied
              // server-side, which means it's fully delegable and there's no 500-row cliff.
              /*SortByColumns(
                  Filter(
                      'Leave Requests',
                      'Leave Requests (Views)'.'Active Leave Requests'
                  ),
                  "cto_startdate",
                  SortOrder.Descending
              )*/
            Width: =1352
            X: =8
            Y: =200
          Children:
            - Title2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.'Request Number'
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =16
                  Y: =30//(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle3.Size * 1.8)) / 2
            - Subtitle2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.'Approval Status'
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title2.Width
                  X: =Title2.X
                  Y: =Title2.Y + Title2.Height
            - Body2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.'Total Days'
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title2.Width
                  X: =Title2.X
                  Y: =Subtitle2.Y + Subtitle2.Height
            - NextArrow2:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="View item details"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator2.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
      - LeaveSummary_1:
          Control: CanvasComponent
          ComponentName: LeaveSummary
          Properties:
            Fill: =RGBA(237, 237, 237, 1)
            Height: =181
            LeaveData: |-
              =// ── APP ➡️ COMPONENT (the coin slot) ──────────────────────────────────
              // We reshape the Dataverse rows into EXACTLY the schema declared in
              // Step A4: Title (text), Days (number), Status (text).
              // galLeaveRequests already holds the filtered rows from Lab 4, so we
              // reuse it rather than re-querying the table.
              ForAll(
                  galLeaveRequests.AllItems As req,
                  {
                      // DISPLAY names here — this is canvas Power Fx, not JavaScript.
                      // (Naming rule from Lab 6: Power Fx = display names,
                      //  JS / C# / Web API = logical names.)
                      Title: req.'Request Number',

                      // Coalesce guards against a blank whole-number column, which would
                      // otherwise flow into the component as blank and break "Days: " & ...
                      Days: Coalesce(req.'Total Days', 0),

                      // The choice column is converted to TEXT here, in the APP, so the
                      // component never has to know about the Dataverse choice.
                      // These enum names were verified by IntelliSense in your environment.
                      Status: Switch(
                          req.'Approval Status',
                          'Approval Status (Leave Requests)'.Pending,  "Pending",
                          'Approval Status (Leave Requests)'.Approved, "Approved",
                          'Approval Status (Leave Requests)'.Rejected, "Rejected",
                          "Unknown"   // fallback so the formula is total
                      )
                  }
              )

              // ── PURPOSE OF THIS FORMULA ───────────────────────────────────────────
              // This is NOT the real data. It is the SCHEMA CONTRACT.
              // Microsoft Learn: "If you specified a data type of Table or Record, you
              // might want to change the value of the Items property to match the data
              // schema that you want to input to the component."
              // Power Fx reads this literal table to learn which column names and types
              // the component is allowed to reference internally. If the app later
              // passes a table whose columns don't match these names/types, you get a
              // type-mismatch error at BIND time, not at run time.
              // ──────────────────────────────────────────────────────────────────────
              /*
              Table(
                  {
                      Title:  "SAMPLE-001",   // text   -> will receive cto_newcolumn (Request Number)
                      Days:   1,              // number -> will receive cto_totaldays  (Total Days)
                      Status: "Pending"       // text   -> will receive a TEXT version of cto_approvalstatus
                  }
              )*/
            Width: =1360
      - lblSelectedFromComponent:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =63
            Size: =20
            Text: |-
              =// ── COMPONENT ➡️ APP (the dispensing tray) ────────────────────────────
              // LeaveSummary_1 is the INSTANCE name, not the component definition name.
              // Learn states this explicitly: "MenuComponent_1 is the default name of an
              // instance, not the name of the component definition."
              // SelectedRequest is a Record, so we drill into one of its fields.
              "Component says you picked: " &
              Coalesce(LeaveSummary_1.SelectedRequest.Title, "(nothing selected yet)")
            Width: =725
            X: =348
            Y: =608
